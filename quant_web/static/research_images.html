<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMA 研报资料库 · 牧云天枢</title><style>:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--down:#2ebd85;--warn:#d29922}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,"PingFang SC",sans-serif}.bar{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.96);border-bottom:1px solid var(--line);padding:13px 20px;backdrop-filter:blur(8px)}.nav,.tools,.actions,.pager{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav a{color:var(--muted);text-decoration:none;font-size:12px}.nav a:first-child{color:var(--accent)}h1{font-size:20px;margin:8px 0 2px}.sub,.meta{color:var(--muted);font-size:12px}.tools{margin-top:12px}.tools input,.tools select,.tools button,.actions button,.pager button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 10px}.tools input{min-width:260px}.tools button,.actions button,.pager button{cursor:pointer}.tools .primary{background:var(--accent);color:#07111c;border-color:var(--accent);font-weight:700}.layout{padding:18px 20px}.meta{margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}.thumb{width:100%;height:180px;object-fit:contain;background:#05070a;border:1px solid #21262d;cursor:zoom-in}.name{font-weight:700;margin:8px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);font-size:11px}.tag.done{color:var(--down);border-color:#1f6f4a}.tag.pending{color:var(--warn);border-color:#7d5c1d}.summary{color:#c9d1d9;font-size:12px;margin-top:7px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.actions{margin-top:8px}.empty{padding:38px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:8px}.pager{justify-content:center;margin:20px}.pager button:disabled{opacity:.45;cursor:not-allowed}.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);padding:30px;overflow:auto}.modal.open{display:block}.modal-body{max-width:1180px;margin:auto;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:8px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.modal-head button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 10px;cursor:pointer}.modal img{width:100%;max-height:72vh;object-fit:contain;background:#000;margin-top:12px}.detail{white-space:pre-wrap;color:#c9d1d9;font-size:13px;margin-top:12px}.detail h3{font-size:14px;color:var(--accent)}.detail pre{max-height:300px;overflow:auto;background:#0d1117;padding:10px;border:1px solid var(--line);font-size:12px}@media(max-width:680px){.layout{padding:12px}.bar{padding:12px}.tools input{min-width:100%}.modal{padding:8px}}</style></head>
<body><header class="bar"><div class="nav"><a href="/">⌂ 主页面</a><a href="/research_dashboard.html">研究</a><a href="/review.html">复盘</a><a href="/report.html">完整报告</a><a href="/knowledge_base.html">方法论</a></div><h1>IMA 研报资料库</h1><div class="sub">研报图片及图像分析。分析不足时不会形成结论。</div><div class="tools"><input id="q" placeholder="搜索主题、图像文字或分析摘要"><select id="module"><option value="">全部模块</option></select><select id="status"><option value="all">全部状态</option><option value="done">已分析</option><option value="pending">待分析/失败</option></select><button class="primary" onclick="load(true)">筛选</button><button onclick="load(false)">刷新</button></div></header><main class="layout"><div class="meta" id="meta">正在加载研报图片…</div><div class="grid" id="grid"></div><div class="pager" id="pager"></div></main><div class="modal" id="modal"><div class="modal-body"><div class="modal-head"><b id="modalTitle"></b><button onclick="closeModal()">关闭</button></div><img id="modalImg"><div class="detail" id="modalDetail"></div></div></div>
<script src="/quant_auth.js"></script><script>let state={offset:0,limit:24,total:0,items:[],modules:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(reset){if(reset)state.offset=0;const q=document.getElementById('q').value.trim(),module=document.getElementById('module').value,status=document.getElementById('status').value,p=new URLSearchParams({q,module,status,limit:state.limit,offset:state.offset});document.getElementById('meta').textContent='正在整理研报图片…';try{const r=await (window.quantApiFetch||fetch)('/api/research_images?'+p),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'图片索引失败');state.total=d.total;state.items=d.items;state.modules=d.modules||[];const sel=document.getElementById('module'),old=sel.value;sel.innerHTML='<option value="">全部模块</option>'+state.modules.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');sel.value=old||module;render(d)}catch(e){document.getElementById('grid').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';document.getElementById('meta').textContent='暂时无法获取研报图片'}}function render(d){const grid=document.getElementById('grid');document.getElementById('meta').textContent=`研报资料 ${d.total} 份 · 当前 ${d.offset+1}-${Math.min(d.offset+d.items.length,d.total)} · 研究资料`;if(!d.items.length){grid.innerHTML='<div class="empty">没有匹配图片。可调整筛选或等待增量分析。</div>';document.getElementById('pager').innerHTML='';return}grid.innerHTML=d.items.map((x,i)=>`<article class="card">${x.asset_type==='image' && x.asset_url ? `<img class="thumb" loading="lazy" src="${encodeURI(x.asset_url)}" alt="${esc(x.title)}" onclick="openModal(${i})">` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#8b949e;cursor:default">📄 ${esc((x.name||'文档').split('.').pop().toUpperCase())}</div>`}<div class="name" title="查看图片证据">${esc(x.title||x.name)}</div><div class="tags"><span class="tag ${x.status}">${x.status==='done'?'已分析':'待分析'}</span><span class="tag">${esc(x.module)}</span><span class="tag">${esc(x.visual_type)}</span>${x.as_of?`<span class="tag">截至 ${esc(x.as_of)}</span>`:''}</div><div class="summary">${esc(x.summary||x.analysis_error||'尚无视觉分析结果')}</div><div class="actions"><button onclick="openModal(${i})">查看原图</button><button onclick="copyText(${i})">复制摘要</button></div></article>`).join('');const prev=d.offset>0,next=d.offset+d.items.length<d.total;document.getElementById('pager').innerHTML=`<button ${prev?'':'disabled'} onclick="page(-1)">上一页</button><span class="sub">第 ${Math.floor(d.offset/state.limit)+1}/${Math.max(1,Math.ceil(d.total/state.limit))} 页</span><button ${next?'':'disabled'} onclick="page(1)">下一页</button>`}function page(delta){state.offset=Math.max(0,state.offset+delta*state.limit);load(false)}function openModal(i){const x=state.items[i];document.getElementById('modalTitle').textContent=x.title||x.name;document.getElementById('modalImg').src=x.asset_url;document.getElementById('modalDetail').innerHTML=`<h3>来源与口径</h3><div>模块：${esc(x.module)} · 类型：${esc(x.visual_type)} · 图内数据日：${esc(x.as_of||'未识别')} · 来源：${esc(x.source_name||'未识别')}</div><h3>图像摘要</h3><div>${esc(x.summary||x.analysis_error||'尚无分析')}</div>${x.key_points?.length?'<h3>要点</h3><ul>'+x.key_points.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':''}${x.ocr_text?'<h3>OCR 原文</h3><pre>'+esc(x.ocr_text)+'</pre>':''}`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function copyText(i){const x=state.items[i];try{await navigator.clipboard.writeText([x.title,x.as_of,x.summary,(x.key_points||[]).join('\n')].filter(Boolean).join('\n'))}catch(e){}}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')load(true)});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});load(true)</script></body></html>
