<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组合绩效深度页 · 牧云天枢</title><link rel="stylesheet" href="/standalone-theme.css?build=20260829-portfolio"><style>
:root{--bg:#0d1117;--panel:#161b22;--inset:#111720;--line:#30363d;--text:#e6edf3;--muted:#8b98a8;--blue:#58a6ff;--up:#f6465d;--down:#2ebd85;--warn:#e3b341}*{box-sizing:border-box}body{margin:0 auto;padding:16px;max-width:1480px;background:var(--bg);color:var(--text);font:13px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.nav,.toolbar,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav{position:sticky;top:0;z-index:20;padding:10px 12px;margin-bottom:14px;background:rgba(13,17,23,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}button,input,select{font:inherit}button{color:var(--text);background:#19212c;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}button.primary,.tab.active{background:#2563eb;border-color:#2563eb;color:#fff}input,select{color:var(--text);background:var(--inset);border:1px solid var(--line);border-radius:7px;padding:7px 9px}.muted{color:var(--muted);font-size:12px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 10px;color:#dce8f4}h3{font-size:13px;margin:0 0 8px;color:#cbd8e5}.hero,.panel{background:linear-gradient(180deg,rgba(23,29,38,.98),rgba(17,22,30,.98));border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}.hero{border-left:3px solid var(--blue)}.hero p{font-size:15px;color:#f0f6fc}.tabs{border-bottom:1px solid var(--line);margin:14px 0}.tab{border-radius:7px 7px 0 0}.tab-panel{display:none}.tab-panel.active{display:block}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:10px 0 14px}.metric{background:var(--inset);border:1px solid var(--line);padding:10px;border-radius:7px}.metric span,.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin:4px 0;font:700 20px var(--terminal-font-num,"SF Mono",monospace)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.table-wrap{overflow:auto;max-height:460px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:11px;position:sticky;top:0;background:#1b222c}td.num{text-align:right;font-variant-numeric:tabular-nums}.good{color:#7bd9a9}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.state{padding:10px;border:1px dashed var(--line);color:var(--muted);margin:8px 0}.state.error{color:#f39a9a;border-color:rgba(246,70,93,.5)}.state.good{color:#7bd9a9;border-color:rgba(63,185,128,.4)}.chart{height:320px}.list{display:grid;gap:6px}.list-item{padding:9px;background:var(--inset);border-left:3px solid var(--blue);border-bottom:1px solid var(--line)}@media(max-width:800px){body{padding:10px}.grid{grid-template-columns:1fr}.hero{padding:12px}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.chart{height:270px}}
</style></head><body>
<nav class="nav"><button onclick="location.href='/'">⌂ 主页面</button><a href="/research_report.html"><button>📑 统一研报</button></a><a href="/research_dashboard.html"><button>🧠 投研看板</button></a><a href="/paper_trading.html"><button>📋 纸面账户</button></a><button class="primary">📊 组合绩效深度页</button><span class="muted">完整组合研究流程 · 不连接券商、不下真实订单</span></nav>
<header class="hero"><h1>组合绩效、风控与配置工作台</h1><p>保留完整组合研究流程：持仓、优化、风控、绩效、因子归因、订单与市场状态。空数据是当前纸面账户事实，不用演示数字填充。</p><div id="pageState" class="state">正在加载组合摘要…</div></header>
<div class="metrics" id="summaryMetrics"></div>
<nav class="tabs" aria-label="组合功能"><button class="tab active" data-tab="positions">📋 持仓</button><button class="tab" data-tab="optimizer">🎯 组合优化</button><button class="tab" data-tab="risk">🛡️ 风控</button><button class="tab" data-tab="performance">📈 绩效</button><button class="tab" data-tab="orders">📜 订单</button><button class="tab" data-tab="regime">🌤️ 市场状态</button></nav>
<section id="positions" class="tab-panel active"><div class="panel"><h2>当前持仓</h2><div id="positionState" class="state">加载中…</div><div class="table-wrap"><table id="positionsTable"></table></div></div></section>
<section id="optimizer" class="tab-panel"><div class="panel"><h2>组合优化</h2><div class="actions"><button data-opt="max_sharpe">高风险收益比</button><button data-opt="min_vol">低波动</button><button data-opt="risk_parity">风险均衡</button><button data-opt="hrp">分层风险配置</button><button data-opt="equal_weight">等权配置</button></div><div id="optimizerState" class="state">选择方法运行真实优化；没有有效输入时不显示伪造权重。</div><div id="optimizerResult"></div></div></section>
<section id="risk" class="tab-panel"><div class="panel"><h2>组合风控检查</h2><div id="riskState" class="state">点击刷新读取当前风险。</div><button id="riskRefresh" class="primary">刷新风控</button><div id="riskResult"></div></div></section>
<section id="performance" class="tab-panel"><div class="panel"><h2>绩效统计</h2><div id="performanceState" class="state">加载中…</div><div id="performanceMetrics" class="metrics"></div><div class="grid"><div><h3>绩效指标</h3><div id="performanceTable"></div></div><div><h3>因子归因</h3><div id="factorAttribution" class="state">点击加载因子归因；示例结果会明确标记。</div><button id="factorRefresh">加载因子归因</button></div></div></div></section>
<section id="orders" class="tab-panel"><div class="panel"><h2>纸面订单记录（近 30 天）</h2><div id="ordersState" class="state">加载中…</div><div class="table-wrap"><table id="ordersTable"></table></div></div></section>
<section id="regime" class="tab-panel"><div class="panel"><h2>市场状态</h2><div id="regimeState" class="state">加载中…</div><div id="regimeMetrics" class="metrics"></div><pre id="regimeText" class="state"></pre></div></section>
<script src="/quant_auth.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=v=>Array.isArray(v)?v:[];const num=v=>v==null||v===''?'-':Number.isFinite(Number(v))?Number(v).toFixed(2):esc(v);async function get(url){const f=window.quantApiFetch||window.fetch;const r=await f(url,{cache:'no-store'});const d=await r.json();if(!r.ok||d.ok===false)throw Error('暂时无法获取组合数据，请稍后重试');return d.data??d}const methodLabel={max_sharpe:'高风险收益比',min_vol:'低波动',risk_parity:'风险均衡',hrp:'分层风险配置',equal_weight:'等权配置'};const stateLabel={completed:'已完成',running:'处理中',pending:'排队中',failed:'未完成'};
function table(id,rows,cols){const el=$(id);if(!el)return;if(!rows.length){el.innerHTML='<tbody><tr><td class="muted">暂无记录（真实账户/数据源当前为空）</td></tr></tbody>';return}el.innerHTML='<thead><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c[0]]??'-')+'</td>').join('')+'</tr>').join('')+'</tbody>'}
async function loadSummary(){try{const d=await get('/api/paper/positions');const s=d.summary||{};$("summaryMetrics").innerHTML=[['账户权益',s.account_equity],['持仓数量',s.num_positions],['可用现金',s.available_cash],['总盈亏%',s.total_pnl_pct],['纸面初始资金',s.paper_initial_cash]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${esc(num(x[1]))}</strong><small>纸面账户真实记录</small></div>`).join('');table('positionsTable',d.positions||[],[['symbol','代码'],['name','名称'],['shares','持仓'],['cost_price','成本'],['current_price','现价'],['pnl_pct','盈亏%']]);$('positionState').textContent=`纸面账户 ${s.num_positions||0} 只 · ${s.cash_basis||'仅作研究模拟'}`;$('pageState').className='state good';$('pageState').textContent='组合摘要已加载 · 所有结果来自纸面账户与本地 API';}catch(e){console.error('[portfolio]',e);$('pageState').className='state error';$('pageState').textContent='暂时无法获取组合摘要，请稍后重试'}}
async function loadRisk(){const box=$('riskResult');$('riskState').textContent='正在读取风险检查…';try{const d=await get('/api/v4/risk/check');const rows=d.alerts||[],pa=d.portfolio_alerts||[];$('riskState').className='state '+(rows.length||pa.length?'error':'good');$('riskState').textContent=rows.length||pa.length?`发现 ${rows.length+pa.length} 条风险告警`:'风险检查完成：当前无已记录告警';box.innerHTML=(rows.concat(pa).map(x=>`<div class="list-item">⚠️ ${esc(x.message||x.reason||JSON.stringify(x))}</div>`).join('')||'<div class="state">暂无风险告警。注意：无持仓不等于无市场风险。</div>')}catch(e){$('riskState').className='state error';$('riskState').textContent='风控接口失败：'+e.message}}
async function loadPerformance(){try{const d=await get('/api/v4/performance/summary');$('performanceState').textContent=`统计时间 ${d.timestamp||'未知'} · 已记录交易 ${d.total_trades??0} 笔`;$("performanceMetrics").innerHTML=[['年化收益',d.annual_return],['年化波动',d.annual_vol],['最大回撤',d.max_drawdown_pct],['夏普',d.sharpe_ratio],['胜率',d.win_rate],['盈亏比',d.payoff_ratio],['95%情景损失',d.var_95]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${esc(num(x[1]))}</strong><small>真实已记录交易</small></div>`).join('');$('performanceTable').innerHTML='<div class="state">总交易 '+esc(d.total_trades??0)+' · 买入 '+esc(d.buy_trades??0)+' · 卖出 '+esc(d.sell_trades??0)+' · 数据不足时指标保持 0，不补演示收益。</div>'}catch(e){$('performanceState').className='state error';$('performanceState').textContent='绩效读取失败：'+e.message}}
async function loadOrders(){try{const d=await get('/api/paper/trades');$('ordersState').textContent=`订单 ${list(d.trades).length} 条 · 纸面成交记录`;table('ordersTable',d.trades||[],[['date','日期'],['symbol','代码'],['side','方向'],['shares','数量'],['price','价格'],['note','备注']])}catch(e){$('ordersState').className='state error';$('ordersState').textContent='订单读取失败：'+e.message}}
async function loadRegime(){try{const d=await get('/api/v4/regime');$('regimeState').textContent=`综合风险 ${d.composite_risk_level??'-'}/10 · 情绪可信度 ${(d.sentiment||{}).confidence||'待确认'}`;$('regimeMetrics').innerHTML=[['趋势',(d.trend||{}).trend],['波动',(d.volatility||{}).state],['流动性',(d.liquidity||{}).state],['情绪',(d.sentiment||{}).state]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${esc(x[1]??'-')}</strong></div>`).join('');$('regimeText').textContent=d.text||JSON.stringify(d,null,2)}catch(e){$('regimeState').className='state error';$('regimeState').textContent='市场状态读取失败：'+e.message}}
async function runOptimize(method){$('optimizerState').textContent=`正在运行 ${methodLabel[method]||'组合优化'}…`;try{const d=await get('/api/v4/portfolio/optimize?method='+encodeURIComponent(method));$('optimizerState').textContent=`${methodLabel[method]||'组合优化'} · ${stateLabel[d.status]||'已完成'} · 结果来自当前账户数据`;const rows=Object.entries(d.weights||{}).map(([symbol,weight])=>({symbol,weight:(Number(weight)*100).toFixed(2)+'%'}));table('optimizerResult',rows,[['symbol','标的'],['weight','权重']])}catch(e){$('optimizerState').className='state error';$('optimizerState').textContent='优化不可用：'+e.message}}
async function loadAttribution(){try{const d=await get('/api/v4/performance/factor_attribution');$('factorAttribution').className='state '+(d.is_placeholder?'':'good');$('factorAttribution').textContent=d.is_placeholder?'当前因子归因为占位结果，不能据此解释收益：'+(d.note||''):JSON.stringify(d,null,2)}catch(e){$('factorAttribution').className='state error';$('factorAttribution').textContent='因子归因读取失败：'+e.message}}
function activate(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.toggle('active',x.id===tab));({positions:loadSummary,optimizer:()=>{},risk:loadRisk,performance:loadPerformance,orders:loadOrders,regime:loadRegime}[tab]||(()=>{}))()}
document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>activate(x.dataset.tab)));document.querySelectorAll('[data-opt]').forEach(x=>x.addEventListener('click',()=>runOptimize(x.dataset.opt)));$('riskRefresh').addEventListener('click',loadRisk);$('factorRefresh').addEventListener('click',loadAttribution);loadSummary();
</script></body></html>
