<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>量化运行控制台</title><style>
:root{--bg:#101418;--panel:#181e24;--line:#303a44;--text:#edf2f7;--muted:#95a1af;--ok:#3ddc97;--warn:#f4bf4f;--bad:#fa6b6b;--accent:#4bb3fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.top h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}.label{color:var(--muted);font-size:12px}.value{font-size:20px;font-weight:650;margin-top:7px;overflow-wrap:anywhere}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.sections{display:grid;grid-template-columns:1.45fr 1fr;gap:10px}.card h2{font-size:14px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.row:first-of-type{border-top:0;padding-top:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}ul{margin:0;padding-left:18px;color:var(--muted)}button{background:transparent;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:5px;cursor:pointer}@media(max-width:800px){.grid,.sections{grid-template-columns:1fr 1fr}.sections{display:block}.sections .card{margin-bottom:10px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><header class="top"><div><h1>量化运行控制台</h1><div class="sub">只显示需要日常确认的运行、数据、决策与纸面执行状态</div></div><div><button onclick="load()">刷新</button> <span class="sub" id="updated">加载中</span></div></header><section class="grid"><div class="card"><div class="label">数据发布</div><div class="value" id="release">--</div><div class="sub" id="releaseSub">--</div></div><div class="card"><div class="label">系统健康</div><div class="value" id="health">--</div><div class="sub" id="healthSub">--</div></div><div class="card"><div class="label">纸面成交率</div><div class="value" id="fill">--</div><div class="sub" id="fillSub">--</div></div><div class="card"><div class="label">最近盘后链</div><div class="value" id="run">--</div><div class="sub" id="runSub">--</div></div></section><section class="sections"><div class="card"><h2>数据发布与异常</h2><div id="domains" class="sub">加载中</div></div><div class="card"><h2>纸面执行</h2><div id="paper" class="sub">加载中</div><details><summary class="sub">录入纸面订单或实际成交</summary><div class="sub" style="margin-top:10px"><input id="psymbol" placeholder="代码" size="8"> <select id="pside"><option value="buy">买入</option><option value="sell">卖出</option></select> <input id="pshares" placeholder="数量" size="7"> <input id="pprice" placeholder="建议价" size="7"> <button onclick="paperOrder()">创建订单</button><br><input id="porder" placeholder="订单ID" size="8"> <input id="pfillshares" placeholder="成交数量" size="8"> <input id="pfillprice" placeholder="成交价" size="7"> <button onclick="paperFill()">回填成交</button><div id="paperResult" class="sub"></div></div></details></div><div class="card"><h2>需要处理</h2><ul id="alerts"><li>加载中</li></ul></div><div class="card"><h2>生产主链</h2><div id="chain" class="sub">加载中</div></div><div class="card"><h2>日常路径</h2><div class="row"><span>日报与决策</span><a href="/review_dashboard.html" class="ok">打开复盘</a></div><div class="row"><span>组合与持仓</span><a href="/portfolio_dashboard.html" class="ok">打开组合</a></div><div class="row"><span>研究验证</span><a href="/research_dashboard.html" class="ok">打开研究</a></div></div></section></main><script src="/ops_health.js"></script><script>
const fmt=x=>x==null?'--':x;const pct=x=>x==null?'--':(Number(x)*100).toFixed(1)+'%';
const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
const esc=x=>String(x??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(u){const r=await fetch(u,{headers:{'X-API-Key':localStorage.getItem('quant_api_key')||''}});if(!r.ok)throw Error(u+' HTTP '+r.status);const b=await r.json();if(!object(b)||b.ok!==true)throw Error(b?.error||u+' 返回结构异常');return b}
function cls(ok,warn=false){return ok?'ok':warn?'warn':'bad'}
function missingNode(id){globalThis.console?.warn('控制台缺少状态节点',id);return {textContent:'',innerHTML:''};}
function show(id,text,color){const n=document.querySelector('#'+id);if(!n){missingNode(id);return;}n.textContent=text;if(color)n.className='value '+color}
function output(id){return document.querySelector(id)||missingNode(id);}
let opsLoadSequence=0;
async function load(){
 const sequence=++opsLoadSequence;
 const results=await Promise.allSettled(['/api/data_health','/api/paper/summary','/api/data_update_status','/api/resident/status'].map(get));
 if(sequence!==opsLoadSequence)return;
 const alerts=[];const result=i=>{if(results[i].status!=='fulfilled')throw Error(results[i].reason?.message||'读取失败');return results[i].value};
 let hs;try{hs=quantOpsHealthState(result(0))}catch(e){hs={label:'读取失败',className:'bad',detail:e.message,alerts:[e.message]}}
 show('health',hs.label,hs.className);show('healthSub',hs.detail);alerts.push(...hs.alerts);
 try{const raw=result(2),data=raw.data||raw;if(!object(data.domains))throw Error('缺少数据域状态');output('#domains').innerHTML=Object.entries(data.domains).map(([name,v])=>{const status=object(v)?v.status:v;const s=String(status||'unknown').toLowerCase();return '<div class="row"><span>'+esc(name)+'</span><span class="'+cls(['ok','pass','succeeded'].includes(s),['warn','warning','partial'].includes(s))+'">'+esc(status||'状态未知')+'</span></div>'}).join('')||'暂无数据域状态'}catch(e){output('#domains').textContent='数据域读取失败：'+e.message;output('#domains').innerHTML=esc('数据域读取失败：'+e.message);alerts.push(e.message)}
 let rs;try{rs=result(3).data;if(!object(rs))throw Error('常驻状态结构异常');
  const rel=rs.release,last=rs.last_after_close;const validDay=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
  const matching=object(rel)&&validDay(rel.expected_day)&&object(last)&&validDay(last.day)&&rel.expected_day===last.day;
  const allowed=matching&&typeof rel.release_id==='string'&&rel.release_id.trim()&&['PASS','OK'].includes(String(rel.status).toUpperCase())&&Array.isArray(rel.errors)&&rel.errors.length===0;
  show('release',object(rel)?rel.release_id||'未生成':'状态未知',allowed?'ok':'bad');show('releaseSub',object(rel)?'数据日 '+fmt(rel.expected_day)+' · 状态 '+fmt(rel.status)+(matching?'':' · 日期未对齐')+' · 警告 '+(Array.isArray(rel.warnings)?rel.warnings.join('、'):'未知'):'发布状态缺失');
  const runValid=object(last)&&validDay(last.day)&&Array.isArray(last.attempts)&&['succeeded','running','retrying','failed'].includes(last.status);
  show('run',runValid?last.status:'状态未知',runValid&&matching&&last.status==='succeeded'?'ok':'bad');show('runSub',runValid?'数据日 '+last.day+' · 重试 '+Math.max(0,last.attempts.length-1)+' 次':'盘后运行证据不足');
  if(!allowed)alerts.push('数据发布未通过或日期/状态证据不足');
 }catch(e){rs=null;show('release','读取失败','bad');show('releaseSub',e.message);show('run','读取失败','bad');show('runSub','本轮常驻证据不可用');alerts.push(e.message)}
 try{const raw=result(1);if(!object(raw.summary)&&!object(raw.data))throw Error('纸面账户结构异常');const paper=rs?.paper_execution;if(!object(paper))throw Error('纸面执行统计不可用');if(paper.error)throw Error(paper.error);
  if(!Number.isInteger(paper.orders)||paper.orders<0||!Number.isFinite(paper.requested_shares)||paper.requested_shares<0||(paper.requested_shares>0&&(!Number.isFinite(paper.fill_rate)||paper.fill_rate<0||paper.fill_rate>1)))throw Error('纸面执行统计不完整');
  show('fill',paper.requested_shares?pct(paper.fill_rate):'暂无委托');show('fillSub','订单 '+paper.orders+' · 不利滑点 '+fmt(paper.mean_adverse_slippage_bps)+' bps');output('#paper').innerHTML=Object.entries(paper).filter(([k])=>['orders','fill_rate','unfilled_orders','partial_orders','mean_adverse_slippage_bps'].includes(k)).map(([k,v])=>'<div class="row"><span>'+esc(k)+'</span><b>'+esc(k==='fill_rate'?pct(v):v)+'</b></div>').join('')||'暂无纸面订单';
 }catch(e){show('fill','不可用','bad');show('fillSub','纸面账户或执行统计读取失败');output('#paper').innerHTML=esc('纸面执行不可用：'+e.message);alerts.push(e.message)}
 output('#chain').innerHTML=['数据发布','市场分析','因子质量','目标权重','订单级审计','决策与交付'].map(x=>'<div class="row"><span>'+x+'</span><span>未提供分阶段状态</span></div>').join('');
 output('#alerts').innerHTML=(alerts.length?alerts:['暂无人工处理项']).map(x=>'<li>'+esc(x)+'</li>').join('');show('updated',results.some(x=>x.status==='rejected')?'部分读取失败':new Date().toLocaleString());
}
load();setInterval(load,60000);
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':localStorage.getItem('quant_api_key')||''},body:JSON.stringify(b)});const out=await r.json();if(!r.ok||out.ok!==true)throw Error(out.error||('HTTP '+r.status));return out}async function paperOrder(){const rs=await get('/api/resident/status');const r=rs.data?.release||{};const out=await post('/api/paper/order',{symbol:document.querySelector('#psymbol').value,direction:document.querySelector('#pside').value,shares:document.querySelector('#pshares').value,suggested_price:document.querySelector('#pprice').value,release_id:r.release_id,notes:'ops_console'});document.querySelector('#paperResult').textContent=out.error||('订单已创建 #'+out.id)}async function paperFill(){const out=await post('/api/paper/fill',{order_id:document.querySelector('#porder').value,filled_shares:document.querySelector('#pfillshares').value,filled_price:document.querySelector('#pfillprice').value});document.querySelector('#paperResult').textContent=out.error||('成交已回填，状态 '+out.status)}</script></body></html>
