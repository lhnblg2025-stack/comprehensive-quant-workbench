<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>量化运行控制台</title><style>
:root{--bg:#101418;--panel:#181e24;--line:#303a44;--text:#edf2f7;--muted:#95a1af;--ok:#3ddc97;--warn:#f4bf4f;--bad:#fa6b6b;--accent:#4bb3fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.top h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}.label{color:var(--muted);font-size:12px}.value{font-size:20px;font-weight:650;margin-top:7px;overflow-wrap:anywhere}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.sections{display:grid;grid-template-columns:1.45fr 1fr;gap:10px}.card h2{font-size:14px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.row:first-of-type{border-top:0;padding-top:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}ul{margin:0;padding-left:18px;color:var(--muted)}button{background:transparent;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:5px;cursor:pointer}@media(max-width:800px){.grid,.sections{grid-template-columns:1fr 1fr}.sections{display:block}.sections .card{margin-bottom:10px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><header class="top"><div><h1>量化运行控制台</h1><div class="sub">只显示需要日常确认的运行、数据、决策与纸面执行状态</div></div><div><button onclick="load()">刷新</button> <span class="sub" id="updated">加载中</span></div></header><section class="grid"><div class="card"><div class="label">数据发布</div><div class="value" id="release">--</div><div class="sub" id="releaseSub">--</div></div><div class="card"><div class="label">系统健康</div><div class="value" id="health">--</div><div class="sub" id="healthSub">--</div></div><div class="card"><div class="label">纸面成交率</div><div class="value" id="fill">--</div><div class="sub" id="fillSub">--</div></div><div class="card"><div class="label">最近盘后链</div><div class="value" id="run">--</div><div class="sub" id="runSub">--</div></div></section><section class="sections"><div class="card"><h2>数据发布与异常</h2><div id="domains" class="sub">加载中</div></div><div class="card"><h2>纸面执行</h2><div id="paper" class="sub">加载中</div><details><summary class="sub">录入纸面订单或实际成交</summary><div class="sub" style="margin-top:10px"><input id="psymbol" placeholder="代码" size="8"> <select id="pside"><option value="buy">买入</option><option value="sell">卖出</option></select> <input id="pshares" placeholder="数量" size="7"> <input id="pprice" placeholder="建议价" size="7"> <button onclick="paperOrder()">创建订单</button><br><input id="porder" placeholder="订单ID" size="8"> <input id="pfillshares" placeholder="成交数量" size="8"> <input id="pfillprice" placeholder="成交价" size="7"> <button onclick="paperFill()">回填成交</button><div id="paperResult" class="sub"></div></div></details></div><div class="card"><h2>需要处理</h2><ul id="alerts"><li>加载中</li></ul></div><div class="card"><h2>生产主链</h2><div id="chain" class="sub">加载中</div></div><div class="card"><h2>日常路径</h2><div class="row"><span>日报与决策</span><a href="/review_dashboard.html" class="ok">打开复盘</a></div><div class="row"><span>组合与持仓</span><a href="/portfolio_dashboard.html" class="ok">打开组合</a></div><div class="row"><span>研究验证</span><a href="/research_dashboard.html" class="ok">打开研究</a></div></div></section></main><script>
const fmt=x=>x==null?'--':x;const pct=x=>x==null?'--':(Number(x)*100).toFixed(1)+'%';async function get(u){const r=await fetch(u);if(!r.ok)throw Error(u);return r.json()}function cls(ok,warn=false){return ok?'ok':warn?'warn':'bad'}async function load(){try{const [rawHealth,rawPaper,rawData,resident]=await Promise.all([get('/api/data_health'),get('/api/paper/summary'),get('/api/data_update_status'),get('/api/resident/status')]);const health=rawHealth.data||rawHealth;const paper=rawPaper.summary||rawPaper.data||rawPaper;const data=rawData.data||rawData;const rs=resident.data||{};const rel=rs.release||{};const last=rs.last_after_close||{};const hOk=health.ok!==false;document.querySelector('#health').textContent=hOk?'正常':'需处理';document.querySelector('#health').className='value '+cls(hOk);document.querySelector('#healthSub').textContent='告警 '+fmt(health.alert_count||health.alerts?.length||0);document.querySelector('#fill').textContent=pct(paper.fill_rate);document.querySelector('#fillSub').textContent='订单 '+fmt(paper.orders)+' · 不利滑点 '+fmt(paper.mean_adverse_slippage_bps)+' bps';document.querySelector('#paper').innerHTML=Object.entries(paper).filter(([k])=>['orders','fill_rate','unfilled_orders','partial_orders','mean_adverse_slippage_bps'].includes(k)).map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+fmt(v)+'</b></div>').join('')||'暂无纸面订单';const items=data.domains||data.items||data;const rows=Array.isArray(items)?items:Object.entries(items).map(([name,v])=>({name,...(typeof v==='object'?v:{status:v)}));document.querySelector('#chain').innerHTML=['数据发布','市场分析','因子质量','目标权重','订单级审计','决策与交付'].map(x=>'<div class="row"><span>'+x+'</span><span class="ok">受主链管理</span></div>').join('');document.querySelector('#domains').innerHTML=rows.slice(0,12).map(x=>'<div class="row"><span>'+fmt(x.name||x.domain)+'</span><span class="'+cls(String(x.status).toLowerCase().includes('ok')||String(x.status).toLowerCase().includes('pass'),String(x.status).toLowerCase().includes('warn'))+'">'+fmt(x.status||x.level)+'</span></div>').join('')||'暂无数据域状态';const alerts=health.alerts||health.errors||[];document.querySelector('#alerts').innerHTML=(alerts.length?alerts:['暂无人工处理项']).map(x=>'<li>'+x+'</li>').join('');document.querySelector('#release').textContent=rel.release_id||'未生成';document.querySelector('#release').className='value '+cls(rel.expected_day&&rel.release_id,true);document.querySelector('#releaseSub').textContent='数据日 '+fmt(rel.expected_day)+' · 警告 '+((rel.warnings||[]).join('、')||'无');document.querySelector('#run').textContent=last.status||'未运行';document.querySelector('#run').className='value '+cls(last.status==='succeeded',last.status==='retrying');document.querySelector('#runSub').textContent='数据日 '+fmt(last.day)+' · 重试 '+fmt((last.attempts||[]).length)+' 次';document.querySelector('#updated').textContent=new Date().toLocaleString()}catch(e){document.querySelector('#alerts').innerHTML='<li>控制台读取失败：'+e.message+'</li>';document.querySelector('#updated').textContent='读取失败'}}load();setInterval(load,60000);
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':localStorage.getItem('quant_api_key')||''},body:JSON.stringify(b)});return r.json()}async function paperOrder(){const rs=await get('/api/resident/status');const r=rs.data?.release||{};const out=await post('/api/paper/order',{symbol:document.querySelector('#psymbol').value,direction:document.querySelector('#pside').value,shares:document.querySelector('#pshares').value,suggested_price:document.querySelector('#pprice').value,release_id:r.release_id,notes:'ops_console'});document.querySelector('#paperResult').textContent=out.error||('订单已创建 #'+out.id)}async function paperFill(){const out=await post('/api/paper/fill',{order_id:document.querySelector('#porder').value,filled_shares:document.querySelector('#pfillshares').value,filled_price:document.querySelector('#pfillprice').value});document.querySelector('#paperResult').textContent=out.error||('成交已回填，状态 '+out.status)}</script></body></html>
