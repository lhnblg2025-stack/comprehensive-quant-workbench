<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一深度研报</title>
<link rel="stylesheet" href="/standalone-theme.css?build=20260828-report">
<style>
:root{--bg:#0d1117;--panel:#161b22;--inset:#111720;--line:#30363d;--text:#e6edf3;--muted:#8b98a8;--blue:#58a6ff;--up:#f6465d;--down:#2ebd85;--warn:#e3b341}
*{box-sizing:border-box}body{margin:0 auto;padding:16px;max-width:1480px;background:var(--bg);color:var(--text);font:13px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{color:var(--text);background:#19212c;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}input,select{color:var(--text);background:var(--inset);border:1px solid var(--line);border-radius:7px;padding:7px 9px}.nav,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}.toolbar{margin:10px 0 14px}.muted{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}.hero,.panel{background:linear-gradient(180deg,rgba(23,29,38,.98),rgba(17,22,30,.98));border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}.hero{border-left:3px solid var(--blue)}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 8px;color:#dce8f4}h3{font-size:13px;margin:0 0 6px;color:#cbd8e5}.meta{color:var(--muted);margin-top:4px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#202a36;color:#b8c7d8;font-size:11px}.badge.good{color:#7bd9a9}.badge.warn{color:#f3c969}.badge.bad{color:#ff8b8b}.summary{font-size:16px;color:#f0f6fc}.chapter{border-top:1px solid var(--line);padding:12px 0}.chapter:first-child{border-top:0}.chapter-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.chapter p{margin:5px 0}.ref{display:inline-block;color:var(--blue);cursor:pointer;margin-right:5px;font-family:var(--terminal-font-num,"SF Mono",monospace);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:9px;margin:6px 0}.item strong{color:#e6edf3}.item small{display:block;color:var(--muted);margin-top:3px}.evidence-item{cursor:pointer}.evidence-item:hover{border-color:var(--blue)}.selected{border-color:var(--warn)!important;box-shadow:0 0 0 2px rgba(227,179,65,.12)}.scroll{max-height:500px;overflow:auto}.empty{color:var(--muted);padding:18px 4px}.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #252c36;padding:5px 0}.kv:last-child{border-bottom:0}.up{color:var(--up)}.down{color:var(--down)}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}.layout>aside{order:-1}}
</style>
</head>
<body>
<nav class="nav"><button onclick="location.href='/'">⌂ 主页面</button><button onclick="location.href='/review.html'">每日复盘</button><button onclick="location.href='/market_weekly.html'">全市场周报</button><button class="primary" onclick="location.href='/research_report.html'">统一深度研报</button><button onclick="location.href='/report.html'">报告归档</button><button onclick="location.href='/research_images.html'">图像证据</button><span class="muted">统一研究口径 · 仅作分析与决策辅助，不连接券商执行</span></nav>
<header><h1>统一深度研报</h1><div class="toolbar"><select id="type"><option value="weekly">全市场周报</option><option value="daily_review">每日复盘</option><option value="stock">个股报告</option><option value="industry">行业报告</option><option value="commodity">商品报告</option></select><input id="symbol" placeholder="代码、行业或商品，如 002714 / 黄金" value="002714"><input id="date" type="date"><button class="primary" onclick="loadReport()">读取报告</button><button onclick="openOriginalReport()">查看完整报告</button></div></header>
<div class="layout"><main><section class="hero"><h2 id="title">加载中…</h2><div id="meta" class="meta"></div><div id="badges" class="badges"></div><p id="summary" class="summary"></p><div id="scope" class="muted"></div></section><section class="panel"><h2>章节结构</h2><div id="chapters"></div></section><section class="panel"><h2>资金与业务传导</h2><div id="transmission"></div></section><section class="panel"><h2>风险与行动条件</h2><div class="grid"><div><h3>风险</h3><div id="risks"></div></div><div><h3>行动</h3><div id="actions"></div></div></div></section><section class="panel"><h2>分析依据</h2><div id="deepIndex" class="grid"><div class="empty">读取原始分析块后显示因子、回测、预测、技术、海外、产业链和引擎状态。</div></div></section></main><aside><section class="panel"><h2>证据链</h2><div id="evidence" class="scroll"></div></section><section class="panel"><h2>数据来源情况</h2><div id="sources"></div></section><section class="panel"><h2>数据缺口</h2><div id="gaps"></div></section></aside></div>
<script src="/quant_auth.js"></script><script>
'use strict';let report=null;const $=id=>document.getElementById(id);const stateLabel=v=>({ok:'证据链完整',degraded:'部分证据可用',failed:'报告不可用'}[v]||'待确认');const deepLabel=v=>({date:'数据日',as_of:'数据日',score:'评分',status:'数据情况',confidence:'可信度',reason:'原因',summary:'摘要',signal:'信号',count:'数量',total:'总数',ic_mean:'信息系数均值',icir:'信息系数稳定性',oos_ic:'样本外信息系数',oos_icir:'样本外稳定性',trade_allowed:'允许进入候选',main_net_yi:'主力净流入（亿元）',return_20d_pct:'近20日变化',weekly_return:'周度变化',max_drawdown_pct:'最大回撤',win_rate:'胜率',factor:'因子',level:'层级',risk:'风险提示',position_range:'建议仓位',observed_at:'观察日期',source_ref:'关联来源',data_as_of:'数据日期',generated_at:'更新时间',available:'可用',missing:'缺失',partial:'部分可用',stale:'数据较旧',fallback:'替代来源',proxy:'参考来源'}[v]||'补充信息');function formatDetail(v){if(!v||typeof v!=='object')return String(v??'');const lines=[];function walk(value,path,depth){if(value===null||value===undefined)return;if(Array.isArray(value)){lines.push(`${'　'.repeat(depth)}${path||'列表'}：${value.length} 条`);value.forEach((item,i)=>walk(item,`${path||'条目'} ${i+1}`,depth+1));return}if(typeof value==='object'){Object.entries(value).forEach(([key,item])=>{if(['path','locator','source_ref','generated_at','root','file','rel','html','raw','url'].includes(key))return;walk(item,deepLabel(key),depth)});return}const text=String(value);const shown=({available:'可用',missing:'缺失',partial:'部分可用',stale:'数据较旧',error:'失败',unknown:'待确认',unavailable:'不可用',neutral:'中性',ok:'正常'}[text]||text);lines.push(`${'　'.repeat(depth)}${path||'内容'}：${shown}`)}walk(v,'',0);return lines.join('\n')||'已提供详细分析，展开高级审计信息查看全部内容';}const actionLabel=v=>({observe:'观察',validate:'复核',buy:'关注',sell:'减仓',hold:'持有观察'}[String(v)]||'观察');const severityLabel=v=>({high:'高',medium:'中',low:'低'}[String(v)]||'待确认');const horizonLabel=v=>({next_session:'下一交易时段',next_review:'下一次复核',next_week:'下一周',weeks:'数周',days:'数日',intraday:'盘中'}[String(v)]||String(v||'待定'));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=v=>Array.isArray(v)?v:[];function refs(ids){return list(ids).map((id,i)=>`<span class="ref" onclick="focusEvidence('${esc(id)}')">证据 ${i+1}</span>`).join('')||'<span class="muted">暂无引用</span>'}function status(s){return ({ok:'正常',failed:'不可用',stale:'数据较旧',fallback:'替代来源',proxy:'参考来源'}[s]||'待确认')}
async function loadReport(){const type=$('type').value;const params=new URLSearchParams({type});if($('date').value)params.set('date',$('date').value);if(type!=='weekly'&&type!=='daily_review')params.set('symbol',$('symbol').value.trim());$('title').textContent='读取真实报告…';try{const d=await window.quantApiWait('/api/research_report?'+params,{},60,1000);if(!d.ok)throw new Error(d.error||'统一研报不可用');report=d.report||{};report._detail=d.detail||null;render()}catch(e){console.error('[research-report]',e);$('title').textContent='暂时无法获取报告';$('meta').textContent='请检查查看日期或稍后重试。'}}
function renderDeepIndex(){const d=report?._detail||{},blocks=d.blocks||{};const names={factor_signal:'因子分析',backtest_check:'回测检查',prediction_loop:'预测验证',technical:'技术结构',overseas:'海外市场',data_base:'数据基座',engine_fusion:'引擎融合',battle_map_card:'作战卡',lhb:'龙虎榜与席位',stock_picks:'候选池',strong_direction:'主线方向',stock_flow:'个股资金',flow:'行业资金',research:'研报依据',stock_news:'个股新闻',score_hierarchy:'分层评分',ic_weight_explanation:'因子权重',commodity:'行业商品',market_context:'宏观背景',evidence_summary:'证据概览',decision:'个股判断',history:'历史序列'};const rows=Object.entries(names).filter(([k])=>d[k]||blocks[k]).map(([k,n])=>{const raw=blocks[k]||d[k]||{};const b=blocks[k]?raw:{};const v=blocks[k]?(b.value||{}):raw;const statusText=b.error?'当前部分不可用：'+b.error:'已有分析';const asOf=v.date||v.as_of||b.date||raw.as_of||'未声明';return `<div class="item"><b>${esc(n)}</b><div class="muted">${esc(statusText)} · 数据日 ${esc(asOf)}</div><small>${esc(formatDetail(v))}</small></div>`}).join('');$('deepIndex').innerHTML=rows||'<div class="empty">本报告没有可索引的深度分析；请查看完整报告和对应专题页面。</div>'}
function render(){const r=report||{},a=r.as_of||{},s=r.status||{},c=r.conclusion||{};renderDeepIndex();$('title').textContent=r.title||'统一深度研报';$('meta').textContent=`数据截至 ${a.data_as_of||'未知'}${a.period_start?` · 区间 ${a.period_start} 至 ${a.period_end}`:''}`;$('summary').textContent=c.summary||'暂无综合结论';$('scope').textContent=(r.scope_detail||{}).execution||'仅作分析与决策辅助，不连接券商执行';$('badges').innerHTML=`<span class="badge ${s.state==='ok'?'good':s.state==='failed'?'bad':'warn'}">${esc(stateLabel(s.state))}</span><span class="badge">可信度：${s.confidence==null?'未评估':(Number(s.confidence)*100).toFixed(0)+'%'}</span><span class="badge">事实 ${list(r.evidence).length} 条</span><span class="badge">数据缺口 ${list(r.data_gaps).length} 项</span>`;renderChapters();renderEvidence();renderSources();renderTransmission();renderRisksActions();renderGaps()}
function renderChapters(){$('chapters').innerHTML=list(report.chapters).map((x,i)=>`<article class="chapter"><div class="chapter-title"><h3>${i+1}. ${esc(x.title)}</h3><span>${refs(x.evidence)}</span></div><p>${esc(x.conclusion)}</p><p class="muted">含义：${esc(x.implication)} · 下一步：${esc(x.next_check)}</p></article>`).join('')||'<div class="empty">暂无章节</div>'}
function openOriginalReport(){const date=$('date').value;window.open('/report.html'+(date?'?date='+encodeURIComponent(date):''),'_blank','noopener')}
function renderEvidence(){$('evidence').innerHTML=list(report.evidence).map((x,i)=>`<article id="ev-${esc(x.id)}" class="item evidence-item" onclick="focusEvidence('${esc(x.id)}')"><strong>证据 ${i+1} · ${esc(x.claim||'未命名事实')}</strong><div>${esc(x.value==null?'':x.value)} ${esc(x.unit||'')}</div><small>${esc(x.observed_at||'日期缺失')} · ${esc(x.quality||'未标注')}</small></article>`).join('')||'<div class="empty">暂无证据</div>'}
function renderSources(){$('sources').innerHTML=list(report.sources).map(x=>`<div class="kv"><span>${esc(x.name||'数据证据')}</span><span class="${x.status==='ok'?'down':x.status==='failed'?'up':'warn'}">${esc(status(x.status))}</span></div><small class="muted">数据日 ${esc(x.observed_at||'未知')}</small>`).join('')||'<div class="empty">暂无数据证据</div>'}
function renderTransmission(){$('transmission').innerHTML=list(report.transmission).map(x=>`<div class="item"><strong>${esc(x.from||'?')} → ${esc(x.to||'?')}</strong><div>${esc(x.mechanism||'机制未补充')} · 方向 ${esc(x.direction||'未知')}</div><small>${refs(x.evidence_refs)}</small></div>`).join('')||'<div class="empty">暂无结构化传导</div>'}
function renderRisksActions(){$('risks').innerHTML=list(report.risks).map(x=>`<div class="item"><strong>${esc(x.description||'风险')}</strong><small>触发：${esc(x.trigger||'未定义')} · 影响：${esc(x.impact||'未定义')} · 风险等级 ${esc(severityLabel(x.severity))}</small><small>${refs(x.evidence_refs)}</small></div>`).join('')||'<div class="empty">暂无风险</div>';$('actions').innerHTML=list(report.actions).map(x=>`<div class="item"><strong>${esc(actionLabel(x.action))} · ${esc(x.target||'')}</strong><small>条件：${esc(x.condition||'未定义')}</small><small>失效：${esc(x.invalidated_by||'未定义')} · 周期 ${esc(horizonLabel(x.horizon))}</small><small>${refs(x.evidence_refs)}</small></div>`).join('')||'<div class="empty">暂无行动</div>'}
function renderGaps(){$('gaps').innerHTML=list(report.data_gaps).map(x=>`<div class="item"><strong>${esc(x.field)}</strong><small>${esc(x.reason)} · ${esc(x.impact)}</small><small>回退：${esc(x.fallback||'无')} · 数据日 ${esc(x.as_of||'未知')}</small></div>`).join('')||'<div class="empty">暂无登记缺口</div>'}
function focusEvidence(id){document.querySelectorAll('.evidence-item').forEach(x=>x.classList.remove('selected'));const el=document.getElementById('ev-'+id);if(el){el.classList.add('selected');el.scrollIntoView({behavior:'smooth',block:'center'})}}
$('type').addEventListener('change',()=>{$('symbol').style.display=['weekly','daily_review'].includes($('type').value)?'none':'inline-block'});$('symbol').style.display='none';loadReport();
</script></body></html>
