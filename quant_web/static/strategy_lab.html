<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>策略实验室</title><script src="/echarts.min.js"></script><style>
:root{--bg:#0b1118;--card:#121d29;--line:#26384a;--txt:#eaf2fa;--muted:#95a8bb;--blue:#69b7ff;--green:#55d6a6;--red:#ff8491;--amber:#f5bf67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui}.app{max-width:1540px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}.top h1{margin:4px 0}.sub,.hint{color:var(--muted)}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);padding:16px}.field{display:grid;gap:6px;margin-bottom:12px}input,select,textarea,button{font:inherit}input,select,textarea{background:#0d1721;color:var(--txt);border:1px solid var(--line);padding:9px}textarea{width:100%;min-height:390px;resize:vertical;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.45}button{padding:9px 12px;border:1px solid var(--line);background:#1c2b3a;color:var(--txt);cursor:pointer}.primary{background:var(--blue);color:#06111d;border-color:var(--blue);font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.list{max-height:160px;overflow:auto}.list button{width:100%;text-align:left;margin:3px 0}.result{white-space:pre-wrap;max-height:220px;overflow:auto;color:var(--muted)}.ok{color:var(--green)}.bad{color:var(--red)}a{color:var(--blue)}#curve{height:340px;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;margin-top:12px}.metric{border:1px solid var(--line);padding:10px;background:#0d1721}.metric b{display:block;font-size:17px;margin-top:5px}.metric span{color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.app{padding:12px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header class="top"><div><div class="hint">OPEN-SOURCE LOW-FREQUENCY STRATEGY LAB</div><h1>策略实验室</h1><div class="sub">主板股票基准：上证指数+深证成指等权；ETF基准：沪深300。信号收盘生成，次日开盘执行。</div></div><a href="/">返回工作台</a></header><section class="grid"><aside class="card"><b>策略版本</b><div id="list" class="list hint">读取中</div><hr><div class="field"><label>内置策略模板</label><select id="templateSelect"></select><div id="templateLifecycle" class="hint" style="max-height:170px;overflow:auto;line-height:1.55"></div></div><div class="field"><label>策略名称</label><input id="name" value="momentum_topn"></div><div class="field"><label>资产类型</label><select id="assetType"><option value="stock">固定300只主板研究子样本（不以今日ST名单回看）</option><option value="etf">行业/宽基ETF（20只历史池）</option></select></div><div class="field"><label>研究期（固定本地快照）</label><select id="mode"><option value="research_5y" selected>研究默认：最近5年</option><option value="research_10y">推荐：最近10年</option></select></div><p class="hint">不再提供两年“快速筛选”。回测只读取版本化本地面板，不联网抓取或静默补数；数据门禁未通过时结果只能标为研究级，不进入策略准入排行。</p><div class="field"><label>持仓数</label><input id="topN" type="number" min="1" max="200" value="20"></div><div class="field"><label>调仓交易日</label><input id="rebalance" type="number" min="2" max="120" value="20"></div><div class="row"><button id="save">保存版本</button><button class="primary" id="run">提交回测</button></div><p class="hint">策略必须实现 <code>build_targets(panel, params)</code>。仅允许 pandas/numpy，禁止网络、文件、进程和动态执行。</p></aside><section class="card"><div class="row" style="justify-content:space-between"><b>策略代码</b><span class="hint" id="templateDesc"></span></div><textarea id="source"></textarea><div class="row"><button id="reset">重置模板</button><button id="refresh">刷新列表</button></div><div class="metrics" id="metrics"></div><div id="curve"></div><hr><b>任务状态</b><div id="result" class="result">尚未提交任务。</div></section></section></main><script>
const $=id=>document.getElementById(id);let defaultSource='',chart;const api=async(url,opt)=>{const r=await fetch(url,opt);const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||r.status);return j};
function show(v,good=false){$('result').className='result '+(good?'ok':'');$('result').textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
const pct=v=>v===null||v===undefined?'--':(Number(v)*100).toFixed(2)+'%';const num=v=>v===null||v===undefined?'--':Number(v).toFixed(3);
function renderRun(r){const m=r.metrics||{},b=r.benchmark||{},g=r.data_gate||{};const allowed=g.admission_eligible===true;$('metrics').innerHTML=[['数据分类',allowed?'可准入':'仅研究级'],['总收益',pct(m.total_return)],['年化',pct(m.annual_return)],['Sharpe',num(m.sharpe)],['最大回撤',pct(m.max_drawdown)],['日换手',pct(m.daily_turnover)],['基准收益',pct(b.total_return)],['成交',m.trades??'--']].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');const rows=r.equity_curve||[];if(!chart)chart=echarts.init($('curve'));chart.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{textStyle:{color:'#95a8bb'},data:['策略净值','基准净值','超额净值','回撤']},grid:{left:55,right:25,top:42,bottom:35},xAxis:{type:'category',data:rows.map(x=>x.date),axisLabel:{color:'#95a8bb',hideOverlap:true}},yAxis:[{type:'value',axisLabel:{color:'#95a8bb'}},{type:'value',axisLabel:{color:'#95a8bb',formatter:v=>(v*100).toFixed(0)+'%'}}],series:[{name:'策略净值',type:'line',showSymbol:false,data:rows.map(x=>x.strategy_nav),lineStyle:{color:'#55d6a6'}},{name:'基准净值',type:'line',showSymbol:false,data:rows.map(x=>x.benchmark_nav),lineStyle:{color:'#69b7ff'}},{name:'超额净值',type:'line',showSymbol:false,data:rows.map(x=>x.excess_nav),lineStyle:{color:'#f5bf67'}},{name:'回撤',type:'line',yAxisIndex:1,showSymbol:false,data:rows.map(x=>x.drawdown),lineStyle:{color:'#ff8491'},areaStyle:{color:'rgba(255,132,145,.08)'}}]});show(`完成：${r.artifact}\n数据：${g.data_source||'--'} · ${g.window?.start||'--'} 至 ${g.window?.end||'--'} · 覆盖率最小值 ${pct(g.coverage?.minimum)}\n分类：${allowed?'可进入准入评估':'仅研究级，禁止进入策略排行'}${g.blockers?.length?'\n阻断：'+g.blockers.join(', '):''}\n快照SHA-256：${g.dataset_sha256||'--'}\n基准：${b.name}\n股票/ETF数量：${r.universe_symbols}，成交：${r.trades}`,true)}
async function loadTemplate(id){if(!id){$('source').value=defaultSource;return}const d=await api('/api/strategy-lab/template?id='+encodeURIComponent(id));$('source').value=d.template.source;$('name').value=id;$('templateDesc').textContent=d.template.description}
async function load(){try{const [d,coverage,admission]=await Promise.all([api('/api/strategy-lab/strategies'),api('/api/strategy-lab/data-status?asset_type='+encodeURIComponent($('assetType').value)),api('/api/strategy-lab/admission')]);defaultSource=d.default_source;const report=coverage.reports?.[$('mode').value];if(report){const approved=report.admission_eligible===true;show(`数据审计：${report.window.start} 至 ${report.window.end}\n本地版本化快照：${report.symbols} 标的 / ${report.rows} 行；截面覆盖最低 ${(Number(report.coverage.minimum)*100).toFixed(1)}%，中位数 ${(Number(report.coverage.median)*100).toFixed(1)}%\n状态：${approved?'可进入准入评估':'仅研究级，禁止策略准入'}${report.blockers?.length?'\n阻断：'+report.blockers.join(', '):''}\n执行状态：模板先通过完整数据目标审计，再进入同一 Backtrader 订单执行；近似向量化筛选不作为前端策略评级依据。\n准入报告：${admission.report?.status||'--'} · 候选 ${admission.report?.candidate_count??0} · 准入 ${admission.report?.admitted_count??0}${admission.source_catalog?.research_ready_domains?.length?'\n研究可用数据域：'+admission.source_catalog.research_ready_domains.join(', '):''}${admission.source_catalog?.admission_blocking_domains?.length?'\n数据源阻断域：'+admission.source_catalog.admission_blocking_domains.join(', '):''}${admission.report?.candidates?.[0]?.blockers?.length?'\n准入阻断：'+admission.report.candidates[0].blockers.join(', '):''}\nSHA-256：${report.dataset_sha256}`,approved)};$('list').innerHTML=(d.strategies||[]).map(s=>`<button data-name="${s.name}">${s.valid?'✓':'!'} ${s.name}</button>`).join('')||'<span class="hint">暂无保存策略</span>';$('templateSelect').innerHTML='<option value="">默认20日动量</option>'+d.templates.map(t=>{const l=t.lifecycle||{};const tag=l.admitted?'准入':l.validated?'已验证':l.full_execution?'全量执行完成':l.execution_status==='running'?'全量执行中':l.full_dataset_comparable?(l.execution_smoke?'全量有信号+冒烟':'全量有信号'):l.compilable?'仅可编译':'失败';return `<option value="${t.id}">[${tag}] ${t.title}</option>`}).join('');$('templateLifecycle').innerHTML=d.templates.map(t=>{const l=t.lifecycle||{};const status=l.admitted?'准入':l.validated?'已验证':l.full_execution?'全量执行完成':l.execution_status==='running'?'全量执行中':l.full_dataset_comparable?'全量有信号':l.compilable?'仅可编译':'失败';const cov=l.target_coverage===undefined?'--':(Number(l.target_coverage)*100).toFixed(1)+'%';return `<div>${esc(t.title)}：${esc(status)} · 目标覆盖 ${esc(cov)}${l.error?' · '+esc(l.error):''}</div>`}).join('');document.querySelectorAll('[data-name]').forEach(b=>b.onclick=async()=>{const x=await api('/api/strategy-lab/strategy?name='+encodeURIComponent(b.dataset.name));$('name').value=x.strategy.name;$('source').value=x.strategy.source});if(!$('source').value)$('source').value=defaultSource}catch(e){show(e.message)}}
$('templateSelect').onchange=()=>loadTemplate($('templateSelect').value);$('assetType').onchange=load;$('mode').onchange=load;$('reset').onclick=()=>$('source').value=defaultSource;$('refresh').onclick=load;
async function save(){return api('/api/strategy-lab/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,source:$('source').value})})}$('save').onclick=async()=>{try{show(await save(),true);load()}catch(e){show(e.message)}};
$('run').onclick=async()=>{try{await save();const d=await api('/api/strategy-lab/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,asset_type:$('assetType').value,mode:$('mode').value,strategy_params:{top_n:+$('topN').value,rebalance_sessions:+$('rebalance').value}})});show('任务已提交：'+d.task_id);const poll=async()=>{const q=await api('/api/btc/task?task_id='+d.task_id);if(q.task.status==='completed')renderRun(q.task.result);else{show(q);if(['pending','running'].includes(q.task.status))setTimeout(poll,2000)}};poll()}catch(e){show(e.message)}};window.addEventListener('resize',()=>chart&&chart.resize());load();
</script></body></html>
