<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全市场周报 · 市场观察</title>
<link rel="stylesheet" href="/standalone-theme.css?build=20260828-weekly">
<style>
:root{--bg:#0d1117;--panel:#161b22;--inset:#111720;--line:#30363d;--text:#e6edf3;--muted:#8b98a8;--accent:#58a6ff;--up:#f6465d;--down:#2ebd85;--warn:#e3b341}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:13px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif;max-width:1500px;margin:auto}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0;color:#d8e4f0}h3{font-size:13px;margin:0 0 8px;color:#cbd8e5}.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border-bottom:1px solid var(--line)}button,input{font:inherit}button{border:1px solid var(--line);border-radius:6px;background:#19212c;color:var(--text);padding:7px 11px;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}input{background:var(--inset);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 9px;width:145px}.meta,.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hero{border:1px solid #39516e;border-left:4px solid var(--accent);background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(17,23,32,.95));padding:16px;margin-bottom:12px}.hero p{margin:6px 0;color:#cbd8e5}.kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin:12px 0}.kpi,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}.kpi strong{display:block;font:700 21px var(--terminal-font-num,"SF Mono",monospace);margin-top:4px}.kpi small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card.span-2{grid-column:1/-1}.chart{height:300px}.table-wrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:11px}td.num{text-align:right;font-variant-numeric:tabular-nums}.section-copy{padding:8px 10px;background:var(--inset);border-left:2px solid var(--accent);margin-bottom:8px}.section-copy b{display:block;color:#dce8f4}.section-copy span{display:block;color:var(--muted);margin-top:3px}.gap{color:var(--warn);background:rgba(227,179,65,.08);padding:8px 10px;border-left:2px solid var(--warn);margin:5px 0}.source-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.source{padding:7px 9px;border:1px solid var(--line);color:var(--muted);font-size:11px}.source b{display:block;color:var(--text);margin-bottom:2px}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(100px,1fr))}.grid{grid-template-columns:1fr}.card.span-2{grid-column:auto}.source-list{grid-template-columns:1fr}}@media(max-width:520px){body{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(100px,1fr))}}
</style>
</head>
<body>
<nav class="nav"><button onclick="location.href='/'">⌂ 主页面</button><button onclick="location.href='/review.html'">每日复盘</button><button class="primary" onclick="location.href='/market_weekly.html'">全市场周报</button><button onclick="location.href='/research_dashboard.html'">深度投研</button><button onclick="location.href='/report.html'">报告归档</button><button onclick="location.href='/research_images.html'">图像证据</button><span class="muted">统一研究口径：分析与决策辅助，不连接券商执行</span></nav>
<header><h1>全市场周报 · 市场观察</h1><div id="meta" class="meta">正在加载周度数据…</div><div class="toolbar"><label class="muted">查看日期 <input type="date" id="asOf"></label><button class="primary" onclick="loadWeekly()">查看本周报告</button><button onclick="loadLatest()">查看最近可用周报</button></div></header>
<section id="hero" class="hero"><h2>核心结论</h2><p id="summary">加载中…</p><p id="scope" class="muted"></p></section>
<div id="kpis" class="kpis"></div>
<main class="grid">
<section class="card span-2"><h2>指数周涨跌与量能</h2><div id="indexChart" class="chart"></div><div id="indexTable" class="table-wrap"></div></section>
<section class="card"><h2>宏观观察</h2><div id="macroCopy"></div><div id="macroTable" class="table-wrap"></div></section>
<section class="card"><h2>成交量与市场资金</h2><div id="flowCopy"></div><div id="flowChart" class="chart"></div></section>
<section class="card"><h2>两融余额与杠杆资金</h2><div id="marginCopy"></div><div id="marginTable" class="table-wrap"></div></section>
<section class="card"><h2>股指期货基差</h2><div id="basisCopy"></div><div id="basisTable" class="table-wrap"></div></section>
<section class="card"><h2>主要指数估值位置</h2><div id="valuationCopy"></div><div id="valuationTable" class="table-wrap"></div></section>
<section class="card"><h2>指数相对强弱</h2><div id="rsCopy"></div><div id="rsChart" class="chart"></div></section>
<section class="card span-2"><h2>行业轮动：申万一级指数周表现</h2><div id="industryCopy"></div><div class="grid"><div id="industryTop" class="table-wrap"></div><div id="industryBottom" class="table-wrap"></div></div></section>
<section class="card"><h2>数据质量与影响</h2><div id="riskList"></div></section>
<section class="card"><h2>下周验证清单</h2><div id="watchList"></div></section>
<section class="card span-2"><h2>来源状态</h2><div id="sources" class="source-list"></div></section>
</main>
<script src="/plotly.min.js"></script><script src="/quant_auth.js"></script><script>
'use strict';
let report=null, charts={};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>v==null||v===''?'-':Number.isFinite(Number(v))?Number(v).toFixed(d):esc(v);
const pct=v=>v==null?'-':`${Number(v)>=0?'+':''}${(Number(v)*100).toFixed(2)}%`;
function statusText(v){return ({available:'可用',missing:'缺失',partial:'部分可用',error:'读取失败'}[v]||v||'未知')}
function chapter(name){return report?.chapters?.[name]||{conclusion:'暂无结论',evidence:{},implication:'暂无策略含义',next_check:'暂无验证条件'}}
function copyChapter(id,name){const c=chapter(name);$(id).innerHTML=`<div class="section-copy"><b>结论：${esc(c.conclusion)}</b><span>含义：${esc(c.implication)}</span><span>下一步：${esc(c.next_check)}</span></div>`}
function renderKpis(){const s=report.summary||{}, i=report.indices||{}, valid=Object.values(i).filter(x=>x.status==='available');const best=valid.slice().sort((a,b)=>(b.value.weekly_return||-9)-(a.value.weekly_return||-9))[0];$('kpis').innerHTML=[['交易日',report.trading_days,'本周有效交易日'],['上涨指数',s.positive_indexes,'/ '+valid.length],['下跌指数',s.negative_indexes,'/ '+valid.length],['最强指数',best?Object.keys(i).find(k=>i[k]===best):'-',best?pct(best.value.weekly_return):'-'],['市场资金',report.market_flow?.value?.主力净流入_sum_yi==null?'-':num(report.market_flow.value.主力净流入_sum_yi)+'亿','周累计'],['两融变化',report.margin?.value?.融资融券余额_change==null?'-':num(report.margin.value.融资融券余额_change/1e8)+'亿','按披露日']].map(x=>`<div class="kpi"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></div>`).join('')}
function plotlyLayout(){return {paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#cbd8e5'},margin:{l:55,r:20,t:20,b:45},hovermode:'x unified',xaxis:{gridcolor:'#30363d'},yaxis:{gridcolor:'#30363d'}}}
function renderIndices(){const rows=Object.entries(report.indices||{}).map(([name,x])=>({name,...(x.value||{}),status:x.status}));$('indexTable').innerHTML=`<table><thead><tr><th>指数</th><th>周涨跌</th><th>周高</th><th>周低</th><th>成交量</th><th>实际数据日</th><th>状态</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td class="num ${Number(x.weekly_return)>=0?'up':'down'}">${pct(x.weekly_return)}</td><td class="num">${num(x.week_high)}</td><td class="num">${num(x.week_low)}</td><td class="num">${num(x.volume_sum,0)}</td><td>${esc(x.last_date||'-')}</td><td>${esc(statusText(x.status))}</td></tr>`).join('')}</tbody></table>`;const valid=rows.filter(x=>x.weekly_return!=null);if(!valid.length)return;Plotly.newPlot($('indexChart'),[{type:'bar',x:valid.map(x=>x.name),y:valid.map(x=>x.weekly_return),text:valid.map(x=>pct(x.weekly_return)),hovertemplate:'%{x}<br>周涨跌 %{text}<extra></extra>',marker:{color:valid.map(x=>x.weekly_return>=0?'#f6465d':'#2ebd85')}}],Object.assign(plotlyLayout(),{yaxis:{title:'周涨跌',tickformat:'.1%'}}),{responsive:true,displaylogo:false,modeBarButtonsToAdd:['toImage']})}
function renderMacro(){copyChapter('macroCopy','宏观观察');$('macroTable').innerHTML=`<table><thead><tr><th>指标</th><th>数值</th><th>变化</th><th>实际观察日</th><th>状态</th></tr></thead><tbody>${Object.entries(report.macro||{}).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num">${num(x.value?.value)}</td><td class="num">${num(x.value?.change)}</td><td>${esc(x.observed_date||'-')}</td><td>${esc(statusText(x.status))}</td></tr>`).join('')}</tbody></table>`}
function renderFlow(){copyChapter('flowCopy','市场资金');const f=report.market_flow?.value||{}, rows=f.daily||[];$('flowChart').innerHTML='';if(!rows.length){$('flowChart').innerHTML='<div class="gap">没有完整周度市场资金流，不能用单日数据替代。</div>';return}Plotly.newPlot($('flowChart'),[{type:'bar',x:rows.map(x=>x.date),y:rows.map(x=>x['主力净流入']/1e8),text:rows.map(x=>num(x['主力净流入']/1e8)+'亿'),hovertemplate:'%{x}<br>主力净流入 %{text}<extra></extra>',marker:{color:rows.map(x=>x['主力净流入']>=0?'#f6465d':'#2ebd85')}}],Object.assign(plotlyLayout(),{yaxis:{title:'亿元',tickformat:'.1f'}}),{responsive:true,displaylogo:false,modeBarButtonsToAdd:['toImage']})}
function renderMargin(){copyChapter('marginCopy','两融');const x=report.margin?.value||{};if(!x.week_end){$('marginTable').innerHTML='<div class="gap">本周没有两融披露日，不能把上次数据改标成本周。</div>';return}const e=x.week_end,s=x.week_start;$('marginTable').innerHTML=`<table><tbody><tr><th>周初披露日</th><td>${esc(s.date)}</td><th>周末披露日</th><td>${esc(e.date)}</td></tr><tr><th>融资余额变化</th><td>${num((e['融资余额']-s['融资余额'])/1e8)}亿</td><th>融资买入合计</th><td>${num(x['融资买入额_sum']/1e8)}亿</td></tr><tr><th>融券余额变化</th><td>${num(x['融券余额_change']/1e8)}亿</td><th>融资融券余额变化</th><td>${num(x['融资融券余额_change']/1e8)}亿</td></tr></tbody></table>`}
function renderBasis(){copyChapter('basisCopy','股指期货基差');const b=report.basis?.value||{};if(!Object.keys(b).length){$('basisTable').innerHTML=`<div class="gap">本周没有 IF/IC/IM/IH 基差观测，不能形成基差方向结论。实际状态：${esc(report.basis?.status||'缺失')}；下一步：补齐本周披露数据。</div>`;return}$('basisTable').innerHTML=`<table><thead><tr><th>合约</th><th>周均贴水率</th><th>最新</th><th>周内高</th><th>周内低</th><th>观测次数</th><th>数据日</th></tr></thead><tbody>${Object.entries(b).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num">${pct(x.weekly_mean)}</td><td class="num">${pct(x.last)}</td><td class="num">${pct(x.high)}</td><td class="num">${pct(x.low)}</td><td class="num">${x.observations??'-'}</td><td>${esc(x.observed_date||'-')}</td></tr>`).join('')}</tbody></table>`}
function renderValuation(){copyChapter('valuationCopy','估值');$('valuationTable').innerHTML=`<table><thead><tr><th>指数</th><th>滚动市盈率</th><th>历史分位</th><th>历史样本</th><th>数据日</th></tr></thead><tbody>${Object.entries(report.valuation||{}).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num">${num(x.value?.pe)}</td><td class="num">${x.value?.historical_percentile==null?'-':(x.value.historical_percentile*100).toFixed(1)+'%'}</td><td class="num">${num(x.value?.history_count,0)}</td><td>${esc(x.observed_date||'-')}</td></tr>`).join('')}</tbody></table>`}
function renderRs(){copyChapter('rsCopy','相对强弱');const rows=Object.entries(report.relative_strength||{}).filter(([,x])=>x.weekly_return!=null);Plotly.newPlot($('rsChart'),[{type:'bar',x:rows.map(x=>x[0]),y:rows.map(x=>x[1].excess_vs_沪深300),text:rows.map(x=>pct(x[1].excess_vs_沪深300)),hovertemplate:'%{x}<br>超额 %{text}<extra></extra>',marker:{color:rows.map(x=>x[1].excess_vs_沪深300>=0?'#f6465d':'#2ebd85')}}],Object.assign(plotlyLayout(),{yaxis:{title:'相对沪深300',tickformat:'.1%'}}),{responsive:true,displaylogo:false,modeBarButtonsToAdd:['toImage']})}
function renderIndustries(){copyChapter('industryCopy','行业轮动');const x=report.industries?.value||{};if(!Object.keys(x).length){const msg=`<div class="gap">本周没有申万行业观测，不能形成行业轮动结论。实际状态：${esc(report.industries?.status||'缺失')}；下一步：补齐本周行业日线。</div>`;$('industryTop').innerHTML=msg;$('industryBottom').innerHTML='';return}const table=(title,rows)=>`<h3>${title}</h3><table><thead><tr><th>行业</th><th>周涨跌</th><th>成交额</th><th>有效天数</th></tr></thead><tbody>${(rows||[]).map(r=>`<tr><td>${esc(r.name)}</td><td class="num ${r.weekly_return>=0?'up':'down'}">${pct(r.weekly_return)}</td><td class="num">${num(r.amount_sum)}</td><td class="num">${r.observations??'-'}</td></tr>`).join('')}</tbody></table>`;$('industryTop').innerHTML=table('领涨行业',x.top10);$('industryBottom').innerHTML=table('靠后行业',x.bottom10)}
function renderRisk(){const gaps=report.data_gaps||[], risks=report.risk_flags||[];const items=[...risks.map(x=>({title:'风险提示',text:x,impact:'影响仓位与方向判断'})),...gaps.map(x=>typeof x==='string'?{title:'数据缺口',text:x,impact:'该项不进入方向性结论'}:{title:'数据缺口 · '+(x.field||''),text:x.reason||'未说明原因',impact:(x.impact||'对应模块不形成强结论')+'；补数后自动恢复。'})];$('riskList').innerHTML=items.map(x=>`<div class="gap"><b>${esc(x.title)}</b>：${esc(x.text)}<br><span class="muted">${esc(x.impact)}</span></div>`).join('')||'<div class="muted">本周核心数据链完整，没有登记缺口。</div>';$('watchList').innerHTML=(report.watchlist||[]).map((x,i)=>`<div class="section-copy"><b>${i+1}. ${esc(x)}</b><span>下一周取得真实数据后，与本周基线对比；日期不一致则降级为观察。</span></div>`).join('')}
function renderSources(){const sources=report.sources||[];$('sources').innerHTML=sources.map(x=>typeof x==='string'?`<div class="source"><b>数据证据</b><span>已纳入报告判断</span></div>`:`<div class="source"><b>${esc(x.name||'数据证据')}</b><span>${esc(statusText(x.status))} · 观察日 ${esc(x.observed_at||'-')} · ${esc(x.note||'')}</span></div>`).join('')}
function render(){const r=report;$('meta').textContent=`报告区间 ${r.period_start} 至 ${r.period_end} · 实际截点 ${r.as_of} · ${r.trading_days} 个交易日 · ${r.data_gaps?.length?'部分数据缺口':'数据链可用'}`;$('summary').textContent=`${r.summary.positive_indexes} 个指数上涨、${r.summary.negative_indexes} 个指数下跌。本周以指数周表现、两融披露、市场资金、股指期货基差、估值位置和申万一级行业轮动为主要证据；缺失项不作方向性替代。`;$('scope').textContent=r.scope_detail?.execution||'本页仅作分析与决策辅助，不连接券商执行。';renderKpis();renderIndices();renderMacro();renderFlow();renderMargin();renderBasis();renderValuation();renderRs();renderIndustries();renderRisk();renderSources()}
async function loadWeekly(){const asOf=$('asOf').value;const url='/api/market_weekly'+(asOf?'?as_of='+encodeURIComponent(asOf):'');$('meta').textContent='正在整理周度数据…';try{const d=await window.quantApiWait(url,{},60,1000);if(!d.ok)throw new Error(d.error||'周报不可用');report=d;$('asOf').value=d.as_of;render()}catch(e){$('meta').textContent='加载失败：'+e.message}}
function loadLatest(){ $('asOf').value='';loadWeekly() }
window.addEventListener('resize',()=>Object.values(charts).forEach(x=>x&&x.resize()));loadWeekly();
</script>
</body></html>
